<!DOCTYPE html>
<html lang="de">
<head>
<!-- Datei auf dem Pi -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,  maximum-scale=1,user-scalable=no">
<title>PiMowBot UI</title>
<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: manipulation;
    overscroll-behavior: none;
}

#main-content{
    width:100vw;
    height:100vh;
    overflow:hidden;
}

/* ===== TABS ===== */
.tabs {
    display: flex;
    justify-content: space-around;
    background: #ddd;
    padding: 10px;
}

.tab {
    color:gray;
    font-weight: bold;
}

/* ===== STATUS ===== */
.status-bar {

    display: flex;
    top: 1px;
    flex-wrap: wrap;
    justify-content: space-between;
    padding: 1px;
}

.status-box {
    background: rgb(255, 255, 255);
    padding: 8px 5px;
    border-radius: 10px;
}


/* Hauptbereich wächst */

.main-content {
    display: flex;
    flex-direction: column;
    flex: 1;
}


/* ===== CONTROLS ===== */
.controls {
    padding: 10px;
}
.toggle-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}
.toggle {
    display: flex;
    flex: 1;
}


.toggle button {
    flex: 1;
    padding: 10px 20px;
    border: none;
    background: #ccc;
}

.toggle .active {
    background: #4caf50;
    color: white;
}

.buttons {
    display: flex;
    gap: 10px;
}

.buttons button {
    flex: 1;
    margin-top: 10px;
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: #bbb;
}
.stopbutton button {
    flex: 1;
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border-radius: 10px;
    font-size:18px;
    font-weight: bold;
    border: none;
   
    background: #e7b733d4;
}

/* ===== JOYSTICK ===== */
/* Joystick nach unten drücken */

.joystick-wrapper {
    margin-top: auto; /* 🔥 wichtig! */
    padding-top: 50px; /* Abstand zum Debug + Not-Aus */
    padding-bottom: auto;
    display: flex;
    justify-content: center;
}
.sensor-label{
    position:absolute;
    color:#888;
    font-size:16px;
    font-weight:bold;
    z-index:1;
    pointer-events:none;
}
#sensorLeft{
    top:300px;
    left:20px;

}
#sensorRight{
    top:300px;
    right:20px;
    text-align:right;

}
#boundary{
    bottom:100px;
    left:20px;
}
#nogo{
    bottom:90px;
    right:20px;
    text-align:center;

}
.joystick-container {
    position: relative;
    width: 80vw;
    max-width: 180px;
    margin: auto;
    aspect-ratio: 1 / 1;
}

/* Kompass Bild */
#compass-img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none; /* 🔥 wichtig */
    transform: rotate(0deg);
}

/* ARC Ebene */

.arc-visual {
    position: absolute;
    width: 108%;
    height: 110%;
    border-radius: 50%;
    border: 25px solid rgba(0, 0, 0, 0.3);
    top: -14%;
    left: -18%;

    clip-path: inset(0 0 50% 0);
}



.arc-layer {
    position: absolute;
    /*background: rgba(255,0,0,0.1);*/
    width: 102%;
    height: 108%;
    top: 50%;
    left: 50%;
   
    /* nur obere Hälfte anzeigen */
    /*clip-path: inset(0 0 50% 0);*/
    transform: translate(-50%, -50%);
    pointer-events: auto;
}
.arc-handle {
    position: absolute;
    width: 34px;
    height: 34px;
    background: #9d9c9c;
    border-radius: 50%;
    top: 45%;
    left: 50%;
   
    transform: translate(-50%, -50%);
    z-index: 5;
}


/* JOYSTICK Ebene */
.joy-layer {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: auto;
}

/* Stick (grüner Punkt) */
#stick {
    position: absolute;
    width: 25%;
    height: 25%;
    background: radial-gradient(circle, #4caf50, #2e7d32);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    touch-action: none;
}

#stick {
    background: radial-gradient(circle, #888, #555);
}

#stick.green {
    background: radial-gradient(circle, #4caf50, #2e7d32);
}

.joy-layer {
    pointer-events: auto;
}

.debugbar{
    position: fixed;
    bottom:50px;
    height:30px;
    width: 100%;
    background:#222;
    color:#00ff00;
    font-size:12px;
    display:flex;
    align-items:center;
    justify-content:center;

}

/* ===== NOT AUS ===== */
.emergency {
    position: fixed;
    bottom: 0;
    height:50px;
    width: 100%;
    background: red;
    color: white;
    display:flex;
    font-size: 20px;
    text-align: center;
    align-items:center;
    justify-content:center;
    
}


</style>
</head>

<script>




let Mower_Mode="";

// Für die Umschaltung auf Shutdown wichtig 
let shutdownMode = false;

let shutdownTimer = null;

// ===== Code zum Datenaustausch =====

const PI_IP = "192.168.178.60"; // ggf anpassen!

let lastSend = 0;

let connected = false;

async function fetchData() {

        document.getElementById("sensorRight").innerText=data.ToF_r + " cm";
        updateHeading(data.kurs);
        updateMowerToggle(data.Blade);
        if (!connected) {

            //setStatus("🟢 Verbunden", "lightgreen");

        }

        //document.getElementById("akku").innerText = "🔋 "+ batdat.Akku +"V";


    } catch (e) {

    }
}

function startDisableTimer(){
    enableSignal=false;

function sendCommand(cmd, value) {

btn.addEventListener("touchstart", function(e){

function sendControl(x, y) {
    let now = Date.now();
    if (now - lastSend < 100 && x!=0 && y!=0 ) return; // max 10 Hz
    
    lastSend = now;

    fetch(API + "/joystick", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({x, y})
    });
}
function sendturn(angle) {
    let now = Date.now();
    if (now - lastSend < 100 && angle!=0 ) return; // max 10 Hz

    lastSend = now;

    fetch(API + "/turn", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({angle})
    });
}

    BTNAUTO.setByIndex(1)  // setzt Betrieb auf AUTO

function clampAngle(angle) {

    if (angle > 90 && angle < 270) {
        // näher an welcher Seite?
        return (angle < 180) ? 90 : 270;
    }

    return angle;
}

function getAngle(x, y, center) {
    let dx = x - center.x;
    let dy = y - center.y;
    //debug(`Center=  ${center.x} `);
    let angle = Math.atan2(dy, dx) * 180 / Math.PI;
    angle = (angle + 90 + 360) % 360;
    return angle;
    //return (angle + 360) % 360;
    
}
const arc = document.getElementById("arc");

arc.addEventListener("touchmove", (e) => {
    e.preventDefault();

    const touch = e.touches[0];
    
    let x = touch.clientX - rect.left;
    let y = touch.clientY - rect.top;
    //debug(`305  ${x}, ${y}, `);

    let angle = getAngle(x, y, center);
    //debug(`Center=  ${center} `);
    angle = clampAngle(angle);
    //debug(`Angle=  ${angle} `);
    //if (angle > 90 && angle < 270) return;
   
    // 👉 Handle bewegen
    setArcHandle(angle);

    /*
    let val = (angle >= 270)
        ? (angle - 360) / 90
        : angle / 90;
    */
    let val;

    if (angle >= 270) {
        // 270 → 360  => -1 → 0
        val = (angle - 270) / 90 - 1;
    } else {
        // 0 → 90 => 0 → +1
        val = angle / 90;
    }

    //debug(`ARC: ${val.toFixed(2)}`);
    sendturn(angle);
});
arc.addEventListener("touchend", () => {

    // zurück nach oben (360°)
    setArcHandle(0);
    //debug(`Angle=  ${0} `);
    sendControl(0, 0);

});

function setArcHandle(angle) {

    //const rect = container.getBoundingClientRect();

    //const cx = rect.width / 2;
    //const cy = rect.height / 2;

    //const r = rect.width * 0.6; // Radius etwas größer als Kompass

    const arcRect = arc.getBoundingClientRect();
    const r = arcRect.width *0.56 // / 2  // - 12.5; // 12 = halbe Border (25px / 2)
    const cx = arcRect.width / 2;
    const cy = arcRect.height / 2;

    // Grad → Radiant
    let rad = (angle-90) * Math.PI / 180;
    
    let x = Math.cos(rad) * r;
    let y = Math.sin(rad) * r;
    //debug(rad);
    // Position relativ zum Container
    arcHandle.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
    //arcHandle.style.transform = `translate(${x}px, ${y}px)`;
    //arcHandle.style.left = `${cx + x}px`;
    //arcHandle.style.top  = `${cy + y}px`;
    //updateHeading(angle);

}

//setArcHandle(360);


const compass = document.getElementById("compass-img");

function angleDiff(a, b) {
    let diff = Math.abs(a - b) % 360;
    return diff > 180 ? 360 - diff : diff;
}

function updateStickColor() {

    // Manueller Modus → immer grau
    if (mode === "MANU") {
        stick.classList.remove("green");
        return;
    }

    // Auto-Modus → Vergleich
    let diff = angleDiff(heading, targetHeading);

    if (diff <= 10) {
        stick.classList.add("green");
    } else {
        stick.classList.remove("green");
    }

    //debug(`Mode:${mode} | Δ:${diff.toFixed(1)}°`);
}


function updateHeading(deg) {
    compass.style.transform = `rotate(${-deg}deg)`;
    updateStickColor();
}
let prev_msg;

// ===== Joystick  =====
const container = document.getElementById("joy");
const stick = document.getElementById("stick");

let rect, center, maxDist;
let active = false;

function updateGeometry() {
    rect = container.getBoundingClientRect();
    center = {
        x: rect.width / 2,
        y: rect.height / 2
    };
    maxDist = rect.width * 0.35;
}


//updateGeometry();
container.addEventListener("touchstart", () => active = true);

container.addEventListener("touchend", () => {
    
    nx=0.00;
    ny=0.00;
    active = false;
    stick.style.transform = `translate(-50%, -50%)`;
    sendControl(0, 0);
    //debug(`X:${nx.toFixed(2)} Y:${ny.toFixed(2)}`);

});

container.addEventListener("touchmove", (e) => {
    if (!active) return;
    e.preventDefault();

    const touch = e.touches[0];
    const maxspeed = 100
    let x = touch.clientX - rect.left;
    let y = touch.clientY - rect.top;

    let dx = x - center.x;
    let dy = y - center.y;

    let dist = Math.sqrt(dx*dx + dy*dy);
    
    // 🎮 JOYSTICK MODUS
    if (dist > maxDist) {
        dx = dx / dist * maxDist;
        dy = dy / dist * maxDist;
    }

    // Stick bewegen (mit Offset!)
    stick.style.transform =
        `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

    let nx = (dx / maxDist).toFixed(2);
    let ny = (-dy / maxDist).toFixed(2);
    

    let normX = dx / maxspeed;
    let normY = dy / maxspeed;

    sendControl(normX, normY)
    //debug(`X:${nx} Y:${ny}   Motorwerte= ${normX}, ${normY} `);
});

function initToggle(id, callback) {
    const buttons = document.querySelectorAll(`#${id} button`);

    function setActive(button) {
        buttons.forEach(b => b.classList.remove("active"));
        button.classList.add("active");
        callback(button.innerText);
    }

    buttons.forEach(btn => {
        btn.addEventListener("click", () => {
            setActive(btn);
        });
    });

    // 👇 NEU: externe Steuerung
    return {
        setByIndex(index) {
            if (buttons[index]) {
                setActive(buttons[index]);
            }
        },

        setByText(text) {
            const btn = [...buttons].find(b => b.innerText === text);
            if (btn) setActive(btn);
        }
    };
}


function updateRTKToggle(running){
     if(enableSignal==false){
        return;
    }
    if (RTKRunning==running){
        return;
        }
    RTKRunning=running;
    if (running){
        BTNAUTO.setByIndex(1)  // setzt den RTK BTN auf ON
    }else{
        BTNAUTO.setByIndex(0)  // setzt den RTK BTN auf OFF
    }

}


function updateMowerToggle(running){
    if(enableSignal==false){
        return;
    }
    if (MowRunning==running){
        return;
        }
    MowRunning=running;    
    if (running){
        BTNMOWER.setByIndex(1)  // setzt den Mower BTN auf ON
        document.getElementById("cutter").innerHTML="🪓 ON";
    }else{
        BTNMOWER.setByIndex(0)  // setzt den Mower BTN auf OFF
        document.getElementById("cutter").innerHTML="🪓 OFF";
    }
}
